// Offline stand-in for the Yandex Games SDK (no ads, local saves)
(function(){
  var P=function(v){return Promise.resolve(v)};
  var K='ysdk_local_data';
  var load=function(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}};
  var player={
    isAuthorized:function(){return true},getName:function(){return 'Player'},getUniqueID:function(){return 'local_001'},
    getPhoto:function(){return ''},getPayingStatus:function(){return 'unknown'},getMode:function(){return 'full'},
    getData:function(){return P(load())},
    setData:function(d){try{var o=load();for(var k in d)o[k]=d[k];localStorage.setItem(K,JSON.stringify(o))}catch(e){}return P()},
    getStats:function(){return P(load().__stats||{})},setStats:function(){return P()},incrementStats:function(){return P()}
  };
  var ysdk={
    environment:{app:{id:'local'},browser:{lang:'en'},i18n:{lang:'en',tld:'com'},payload:''},
    deviceInfo:{type:'desktop',isMobile:function(){return false},isDesktop:function(){return true},isTablet:function(){return false},isTV:function(){return false}},
    screen:{fullscreen:{status:'off',request:function(){return P()},exit:function(){return P()}}},
    auth:{openAuthDialog:function(){return P()}},
    adv:{
      showFullscreenAdv:function(o){var c=(o&&o.callbacks)||{};setTimeout(function(){if(c.onClose)c.onClose(false)},0)},
      showRewardedVideo:function(o){var c=(o&&o.callbacks)||{};setTimeout(function(){if(c.onRewarded)c.onRewarded();if(c.onClose)c.onClose()},0)},
      showBannerAdv:function(){return P()},hideBannerAdv:function(){return P()},
      getBannerAdvStatus:function(){return P({stickyAdvIsShowing:false,reason:'not supported'})}
    },
    feedback:{canReview:function(){return P({value:false,reason:'UNKNOWN'})},requestReview:function(){return P({feedbackSent:false})}},
    shortcut:{canShowPrompt:function(){return P({canShow:false})},showPrompt:function(){return P({outcome:'rejected'})}},
    features:{LoadingAPI:{ready:function(){}},GameplayAPI:{start:function(){},stop:function(){}}},
    getPlayer:function(){return P(player)},
    getStorage:function(){return P({getItem:function(k){return localStorage.getItem(k)},setItem:function(k,v){localStorage.setItem(k,v)},removeItem:function(k){localStorage.removeItem(k)},clear:function(){}})},
    getPayments:function(){return P({getCatalog:function(){return P([])},getPurchases:function(){return P([])},purchase:function(){return P({})},consumePurchase:function(){return P()}})},
    getLeaderboards:function(){return P({getLeaderboardDescription:function(){return P({})},getLeaderboardEntries:function(){return P({entries:[],ranges:[]})},setLeaderboardScore:function(){return P()}})},
    isAvailableMethod:function(){return P(false)},
    on:function(){},off:function(){},dispatchEvent:function(){return P()}
  };
  window.YaGames={init:function(){return P(ysdk)}};
})();
</script>

    <script>
        YaGames
            .init()
            .then(ysdk => {
                console.log('Yandex SDK initialized');
                window.ysdk = ysdk;
                initPlayer();
            });
        
        var player;

        function initPlayer() {
            return ysdk.getPlayer({ scopes: false }).then(_player => {
                player = _player;
                return player;
            });
        }

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "https://quantil.jsdelivr.net/gh/my-files-schoolum/o8k@main/Build";
        var loaderUrl = buildUrl + "/Granny_Nightmare.loader.js";

        // WASM dosyalarını birleştirme fonksiyonu
        async function mergeWasmFiles() {
            const part1Url = buildUrl + "/Granny_Nightmare_part1.wasm";
            const part2Url = buildUrl + "/Granny_Nightmare_part2.wasm";

            // Her iki parçayı indir
            const [part1Response, part2Response] = await Promise.all([
                fetch(part1Url),
                fetch(part2Url)
            ]);

            const part1Buffer = await part1Response.arrayBuffer();
            const part2Buffer = await part2Response.arrayBuffer();

            // Buffer'ları birleştir
            const totalLength = part1Buffer.byteLength + part2Buffer.byteLength;
            const mergedBuffer = new Uint8Array(totalLength);
            mergedBuffer.set(new Uint8Array(part1Buffer), 0);
            mergedBuffer.set(new Uint8Array(part2Buffer), part1Buffer.byteLength);

            // Blob olarak döndür ve URL oluştur
            const blob = new Blob([mergedBuffer], { type: "application/wasm" });
            return URL.createObjectURL(blob);
        }

        // Config güncellemesi
        var config = {
            dataUrl: buildUrl + "/Granny_Nightmare.data",
            frameworkUrl: buildUrl + "/Granny_Nightmare.framework.js",
            codeUrl: "", // Bu kısmı dinamik olarak dolduracağız
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Night Mare",
            productVersion: "0.1",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        loadingBar.style.display = "block";
        var myGameInstance = null;

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = async () => {
            // WASM dosyalarını birleştir ve config'e ekle
            try {
                config.codeUrl = await mergeWasmFiles();
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then((unityInstance) => {
                    myGameInstance = unityInstance;
                    loadingBar.style.display = "none";
                }).catch((message) => {
                    alert(message);
                });
            } catch (error) {
                alert("WASM dosyaları birleştirilirken hata oluştu: " + error);
            }
        };

        document.body.appendChild(script);
    </script>
